name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.1.0-devel-ubuntu22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        apt-get update
        apt-get install -y wget gnupg software-properties-common python3.10 python3.10-dev python3.10-venv python3-pip git
        # Install LLVM 20 tools
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main"
        apt-get update
        apt-get install -y llvm-20 llvm-20-dev llvm-20-tools mlir-20-tools
        ln -s /usr/bin/llc-20 /usr/bin/llc
        ln -s /usr/bin/mlir-translate-20 /usr/bin/mlir-translate

    - name: Install Poetry
      run: |
        python3.10 -m pip install pip --upgrade
        python3.10 -m pip install poetry
        poetry --version

    - name: Install dependencies
      run: |
        poetry env use python3.10
        poetry install --with gpu

    - name: Check CUDA environment
      run: |
        echo "CUDA version:"
        nvcc --version || echo "nvcc not available in PATH, but CUDA libraries should be present"
        echo "CUDA libraries:"
        ls -la /usr/local/cuda/lib64 || echo "CUDA libraries not found in standard location"
        echo "LD_LIBRARY_PATH:"
        echo $LD_LIBRARY_PATH

    - name: Run MLIR Example
      run: |
        poetry run python example_mlir.py
